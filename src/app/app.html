@if (isBooting()) {
  <app-startup-screen (done)="onStartupDone()" />
}

<div class="app-shell" [attr.inert]="isBooting() ? '' : null">
  <app-navbar [links]="navLinks" />

  <main id="conteudo-principal" class="main-content">
    <app-hero-section [hero]="heroData" [code]="heroCode" />
    <div class="sections-content">
      <app-about-section [about]="aboutData" />
      <app-experience-section [items]="experienceItems" />
      <app-projects-section [projects]="projectItems" [githubUrl]="contactData.githubUrl" />
      <app-work-section [steps]="workflowSteps" />
      <app-technologies-section [groups]="technologyGroups" />
      <app-contact-section [contact]="contactData" />
    </div>
  </main>

  <app-footer />
</div>
